# CORS 설정
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# 파일 업로드 설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2KB

# 애플리케이션 커스텀 업로드 설정(코드에서 @Value 등으로 주입해서 사용)
file.upload.path=uploads/
file.upload.max-files=10

# 서버 포트 (외부 Tomcat 배포시 무시됨, Boot 실행시에만 적용)
server.port=8080

# 로깅
logging.level.com.app=DEBUG
logging.level.org.springframework.web=DEBUG



# === Front URL ===
oauth.front-success=http://localhost:3000/
oauth.front-fail=http://localhost:3000/login?error=1

# 라우터 경로에 맞춰 /oauth/role 로 수정 (이전에 /role 이었던 값 정리)
oauth.front-role-select=http://localhost:3000/oauth/role

